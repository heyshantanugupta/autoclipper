name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach builds to (optional)"
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q
      - name: Build the app
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClipper-windows
          path: dist/AutoClipper.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/AutoClipper.exe
          generate_release_notes: true

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            tag: mac-arm64
          - os: macos-15-intel
            tag: mac-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q
      - name: Build the app
        run: python build.py
      - name: Zip the app
        run: ditto -c -k --keepParent dist/AutoClipper.app AutoClipper-${{ matrix.tag }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClipper-${{ matrix.tag }}
          path: AutoClipper-${{ matrix.tag }}.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: AutoClipper-${{ matrix.tag }}.zip
          generate_release_notes: true
