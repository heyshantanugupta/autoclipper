name: Build desktop apps

# Builds the Windows and Mac apps on GitHub's own machines (free for public repositories).
# Run it by hand from the Actions tab (it asks for a version name such as v0.1.3 and publishes a Release),
# or push a version tag such as v0.1.3 to do the same.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release name, for example v0.1.3"
        required: true
        default: "v0.1.3"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: AutoClipper-VERSION-windows-x64.exe
          - os: macos-15
            file: AutoClipper-VERSION-mac-arm64.zip
          - os: macos-15-intel
            file: AutoClipper-VERSION-mac-x64.zip
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The app shows its version and checks for updates, so set it from the release name.
      - name: Set app version from the release name
        shell: bash
        run: |
          VERSION="${TAG#v}"
          python -c "import sys; open('autoclipper/__init__.py','w').write('\"\"\"AutoClipper: turn any video link or file into a ready-to-post short.\"\"\"\n__version__ = \"%s\"\n' % sys.argv[1])" "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q
      - run: python build.py
      - name: Name the file
        shell: bash
        run: |
          mkdir out
          NAME="${{ matrix.file }}"; NAME="${NAME/VERSION/$VERSION}"
          if [ "$RUNNER_OS" = "Windows" ]; then cp dist/AutoClipper.exe "out/$NAME"; else ditto -c -k --keepParent dist/AutoClipper.app "out/$NAME"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClipper-${{ matrix.os }}
          if-no-files-found: error
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true

  # Point the README download buttons at the files of the release that was just published.
  readme:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update download links
        run: |
          export VERSION="${TAG#v}"
          perl -pi -e 's{releases/(?:latest/download|download/[^/]+)/}{releases/download/$ENV{TAG}/}g; s{AutoClipper-(?:[\d.]+-)?windows-}{AutoClipper-$ENV{VERSION}-windows-}g; s{AutoClipper-(?:[\d.]+-)?mac-}{AutoClipper-$ENV{VERSION}-mac-}g' README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Point download buttons at $TAG" && git push origin HEAD:main)
